<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalPro - Login (Render Connected)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        .content {
            display: flex;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 90%;
            max-width: 900px;
        }

        .branding {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .branding h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .branding p {
            font-size: 18px;
            opacity: 0.9;
        }

        .form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h2 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.3s;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-size: 14px;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .note {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 3px;
            font-size: 12px;
            color: #666;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .branding {
                padding: 30px;
            }

            .form-section {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="branding">
                <h1>LEGAL PRO</h1>
                <p>justice anytime anywhere</p>
            </div>
            <div class="form-section">
                <h2>Sign In</h2>
                <p style="color: #999; margin-bottom: 20px; font-size: 14px;">Access your court case information</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">EMAIL ADDRESS</label>
                        <input type="email" id="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    
                    <button type="submit" id="signinBtn">
                        <span class="spinner" id="spinner"></span>
                        <span id="signinText">Sign In</span>
                    </button>

                    <div class="message success-message" id="successMsg"></div>
                    <div class="message error-message" id="errorMsg"></div>

                    <div class="note">
                        <strong>Demo Mode:</strong> Use any email and password to login. Your account will be created automatically.
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // CRITICAL: Set backend URL to Render
        const API_BASE_URL = 'https://legalpro-ry3o.onrender.com';
        console.log('🔗 Backend API:', API_BASE_URL);

        const form = document.getElementById('loginForm');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');
        const spinner = document.getElementById('spinner');
        const signinBtn = document.getElementById('signinBtn');
        const signinText = document.getElementById('signinText');

        form.addEventListener('submit', handleLogin);

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            spinner.style.display = 'inline-block';
            signinText.textContent = 'Signing in...';
            signinBtn.disabled = true;

            try {
                console.log('🔄 Attempting login to:', `${API_BASE_URL}/api/auth/login`);
                
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                console.log('📡 Response status:', response.status);

                const data = await response.json();
                console.log('📦 Response:', data);

                if (response.ok) {
                    console.log('✅ Login successful!');
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    successMsg.textContent = '✓ Login successful! Redirecting...';
                    successMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    const errorText = data.detail || 'Login failed';
                    console.log('❌ Login failed:', errorText);
                    errorMsg.textContent = '✗ ' + errorText;
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('💥 Error:', error);
                errorMsg.textContent = `✗ Connection error: ${error.message}. Backend: ${API_BASE_URL}`;
                errorMsg.style.display = 'block';
            } finally {
                spinner.style.display = 'none';
                signinText.textContent = 'Sign In';
                signinBtn.disabled = false;
            }
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                console.log('✅ User already logged in, redirecting...');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
