version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: court-ecosystem-db
    environment:
      POSTGRES_USER: court_user
      POSTGRES_PASSWORD: court_password
      POSTGRES_DB: court_ecosystem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U court_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: court-ecosystem-api
    environment:
      DATABASE_URL: postgresql://court_user:court_password@db:5432/court_ecosystem
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    image: nginx:alpine
    container_name: court-ecosystem-dashboard
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data:
